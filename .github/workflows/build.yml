name: Build unsigned IPA and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests and 10,000-game simulation
        run: swift test

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project Durak.xcodeproj -scheme Durak -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Durak.app Payload/
          zip -r Durak.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Durak-unsigned-ipa
          path: Durak.ipa
